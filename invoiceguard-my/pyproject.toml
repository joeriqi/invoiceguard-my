[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoiceguard-my"
version = "0.1.1"
description = "AI-assisted invoice intake and MyInvois validation for Malaysian SMEs (prototype, synthetic data)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E701", "E702", "E731", "E741", "B905", "E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["B018", "E402"]
"app/*" = ["E402"]
"dashboard/*" = ["E402"]
